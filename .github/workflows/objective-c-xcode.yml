name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Target bundle identifier
        required: false
        default: com.apple.mobile.MobileHouseArrest
        type: string
      project_name:
        description: Output IPA name
        required: false
        default: OGIOS
        type: string
      scheme:
        description: Xcode scheme
        required: false
        default: OGIOS
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip full source
        run: |
          set -euo pipefail
          if [ -f "Full source 3105 OG.zip" ]; then
            echo "Found Full source 3105 OG.zip — extracting..."
            unzip -o "Full source 3105 OG.zip"
            if [ -d letme-2-main ]; then
              cp -R letme-2-main/* .
              cp -R letme-2-main/.[!.]* . 2>/dev/null || true
              rm -rf letme-2-main
            fi
          fi

      - name: Apply unlock + patch fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Unlock FF MAX
          cv = Path("ThreeOneOSFive/ContentView.swift")
          text = cv.read_text(encoding="utf-8")
          old = 'lockedLaunchButton(title: "FF MAX", subtitle: "Locked • Coming Soon", color: AppTheme.secondaryAccent)'
          new = 'launchButton(title: "FF MAX", subtitle: "Free Fire MAX", color: AppTheme.secondaryAccent, scheme: "freefiremax")'
          if old in text:
              text = text.replace(old, new)
              print("FF MAX unlocked")

          # 2) Better openGame with fallbacks + feedback
          old_open = '''    private func openGame(scheme: String) {
        guard let url = URL(string: "\\(scheme)://") else { return }
        UIApplication.shared.open(url, options: [:]) { success in
            log("launch: \\(scheme) success=\\(success)")
        }
    }'''
          # use actual single backslash version in file
          old_open = """    private func openGame(scheme: String) {
        guard let url = URL(string: \"\\(scheme)://\") else { return }
        UIApplication.shared.open(url, options: [:]) { success in
            log(\"launch: \\(scheme) success=\\(success)\")
        }
    }"""
          # simpler: find and replace by unique lines
          import re
          pattern = r'private func openGame\(scheme: String\) \{[\s\S]*?^    \}'
          replacement = '''private func openGame(scheme: String) {
        var candidates = [scheme]
        if scheme == "freefireth" {
            candidates += ["freefire", "freefireth", "garena.freefire"]
        } else if scheme == "freefiremax" {
            candidates += ["freefiremax", "freefirethmax", "freefiremaxth", "garena.freefiremax"]
        }
        var seen = Set<String>()
        candidates = candidates.filter { seen.insert($0).inserted }

        func tryNext(_ list: [String]) {
            guard let first = list.first else {
                DispatchQueue.main.async {
                    self.patchMessage = "GAME NOT INSTALLED — install Free Fire / FF MAX first"
                }
                log("launch: all schemes failed")
                return
            }
            guard let url = URL(string: "\\(first)://") else {
                tryNext(Array(list.dropFirst()))
                return
            }
            UIApplication.shared.open(url, options: [:]) { success in
                log("launch: \\(first) success=\\(success)")
                if success {
                    DispatchQueue.main.async {
                        self.patchMessage = "LAUNCHED — \\(first)"
                    }
                } else {
                    tryNext(Array(list.dropFirst()))
                }
            }
        }
        tryNext(candidates)
    }'''
          new_text, n = re.subn(pattern, replacement, text, count=1, flags=re.M)
          if n:
              text = new_text
              print("openGame replaced")
          else:
              print("openGame pattern not matched")
          cv.write_text(text)

          # 3) License always active
          lm = Path("ThreeOneOSFive/helpers/LicenseManager.swift")
          t = lm.read_text(encoding="utf-8")
          t = t.replace("isActive = hasRememberedKey", "isActive = true")
          t = t.replace(
              'message = isActive ? "Ready to use" : "Key required — enter your access key"',
              'message = "Ready to use"'
          )
          lm.write_text(t)
          print("License forced active")

          # 4) Fix .3105 extension in PatchProjectLibrary
          lib = Path("ThreeOneOSFive/helpers/PatchProjectLibrary.swift")
          lt = lib.read_text(encoding="utf-8")
          lt = lt.replace(
              'bundle.urls(forResourcesWithExtension: "OGIOS", subdirectory: "Patches") ?? []',
              'bundle.urls(forResourcesWithExtension: "3105", subdirectory: "Patches") ?? []'
          )
          lt = lt.replace(
              'bundle.urls(forResourcesWithExtension: "OGIOS", subdirectory: nil) ?? []',
              '(bundle.urls(forResourcesWithExtension: "3105", subdirectory: nil) ?? []) + (bundle.urls(forResourcesWithExtension: "OGIOS", subdirectory: nil) ?? []) + (bundle.urls(forResourcesWithExtension: "OGIOS", subdirectory: "Patches") ?? [])'
          )
          lt = lt.replace(
              'for url in urls where url.pathExtension.lowercased() == "OGIOS" {',
              'for url in urls where ["ogios", "3105"].contains(url.pathExtension.lowercased()) {'
          )
          lib.write_text(lt)
          print("PatchProjectLibrary extension fixed")
          PY

      - name: Locate Xcode project
        id: locate
        env:
          INPUT_SCHEME: ${{ inputs.scheme }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJECT=$(find "$ROOT" -name '*.xcodeproj' -type d -print -quit)
          WORKSPACE=$(find "$ROOT" -name '*.xcworkspace' -type d -not -path '*/Pods/*' -print -quit)
          if [ -z "$PROJECT" ] && [ -z "$WORKSPACE" ]; then
            echo 'No .xcodeproj found' >&2; exit 1
          fi
          if [ -n "$INPUT_SCHEME" ]; then SCHEME="$INPUT_SCHEME"
          elif [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("workspace",{}).get("schemes") or [""])[0])')
          else
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned archive
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
          WORKSPACE: ${{ steps.locate.outputs.workspace }}
          SCHEME: ${{ steps.locate.outputs.scheme }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          if [ -n "$WORKSPACE" ]; then
            xcodebuild archive -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphoneos -configuration Release -archivePath "$ARCHIVE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" | tee "$RUNNER_TEMP/xcodebuild.log"
          else
            xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -archivePath "$ARCHIVE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" | tee "$RUNNER_TEMP/xcodebuild.log"
          fi

      - name: Package IPA
        env:
          IPA_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d -print -quit)
          [ -n "$APP_PATH" ] || { echo 'No .app produced' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/${IPA_NAME}.ipa"
          ls -lh "$RUNNER_TEMP/${IPA_NAME}.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name }}-unsigned-ipa
          path: ${{ runner.temp }}/${{ inputs.project_name }}.ipa
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name }}-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
