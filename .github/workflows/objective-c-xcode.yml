name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Target bundle identifier
        required: false
        default: com.apple.mobile.MobileHouseArrest
        type: string
      project_name:
        description: Output IPA name
        required: false
        default: OGIOS
        type: string
      scheme:
        description: Xcode scheme
        required: false
        default: OGIOS
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip full source
        run: |
          set -euo pipefail
          if [ -f "Full source 3105 OG.zip" ]; then
            echo "Found Full source 3105 OG.zip — extracting..."
            unzip -o "Full source 3105 OG.zip"
            if [ -d letme-2-main ]; then
              cp -R letme-2-main/* .
              cp -R letme-2-main/.[!.]* . 2>/dev/null || true
              rm -rf letme-2-main
            fi
            ls -la
          else
            echo "No zip found, using repo root as-is"
          fi

      - name: Unlock FF MAX + force license active
        run: |
          set -euo pipefail
          # Unlock FF MAX button
          python3 - <<'PY'
          from pathlib import Path
          cv = Path("ThreeOneOSFive/ContentView.swift")
          text = cv.read_text(encoding="utf-8")
          old = 'lockedLaunchButton(title: "FF MAX", subtitle: "Locked • Coming Soon", color: AppTheme.secondaryAccent)'
          new = 'launchButton(title: "FF MAX", subtitle: "Free Fire MAX", color: AppTheme.secondaryAccent, scheme: "freefiremax")'
          if old in text:
              text = text.replace(old, new)
              cv.write_text(text)
              print("FF MAX unlocked")
          else:
              print("FF MAX pattern not found — already unlocked or different source")
          # Force license always active
          lm = Path("ThreeOneOSFive/helpers/LicenseManager.swift")
          t = lm.read_text(encoding="utf-8")
          t = t.replace(
              "func refresh() {\n        isActive = hasRememberedKey\n        message = isActive ? \"Ready to use\" : \"Key required — enter your access key\"\n    }",
              "func refresh() {\n        isActive = true\n        message = \"Ready to use\"\n    }"
          )
          t = t.replace("isActive = hasRememberedKey", "isActive = true")
          lm.write_text(t)
          print("LicenseManager forced active")
          PY

      - name: Locate Xcode project
        id: locate
        env:
          INPUT_SCHEME: ${{ inputs.scheme }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJECT=$(find "$ROOT" -name '*.xcodeproj' -type d -print -quit)
          WORKSPACE=$(find "$ROOT" -name '*.xcworkspace' -type d -not -path '*/Pods/*' -print -quit)
          if [ -z "$PROJECT" ] && [ -z "$WORKSPACE" ]; then
            echo 'No .xcodeproj or .xcworkspace found.' >&2
            find "$ROOT" -maxdepth 3 -type d | head -50
            exit 1
          fi
          if [ -n "$INPUT_SCHEME" ]; then
            SCHEME="$INPUT_SCHEME"
          elif [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("workspace",{}).get("schemes") or [""])[0])')
          else
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')
          fi
          [ -n "$SCHEME" ] || { echo 'No Xcode scheme found.' >&2; exit 1; }
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using project: $PROJECT"
          echo "Using scheme: $SCHEME"

      - name: Build unsigned archive
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
          WORKSPACE: ${{ steps.locate.outputs.workspace }}
          SCHEME: ${{ steps.locate.outputs.scheme }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          if [ -n "$WORKSPACE" ]; then
            xcodebuild archive -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphoneos -configuration Release -archivePath "$ARCHIVE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" | tee "$RUNNER_TEMP/xcodebuild.log"
          else
            xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -archivePath "$ARCHIVE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" | tee "$RUNNER_TEMP/xcodebuild.log"
          fi

      - name: Package IPA
        env:
          IPA_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d -print -quit)
          [ -n "$APP_PATH" ] || { echo 'No .app was produced by xcodebuild.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/${IPA_NAME}.ipa"
          test -s "$RUNNER_TEMP/${IPA_NAME}.ipa"
          ls -lh "$RUNNER_TEMP/${IPA_NAME}.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name }}-unsigned-ipa
          path: ${{ runner.temp }}/${{ inputs.project_name }}.ipa
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name }}-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
